name: Update star magnitude

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout profile
        uses: actions/checkout@v4

      - name: Update magnitude marker
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request

          token = os.environ["GH_TOKEN"]
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "X-GitHub-Api-Version": "2022-11-28",
          }

          total = 0
          page = 1
          while True:
              query = urllib.parse.urlencode({
                  "per_page": 100,
                  "page": page,
              })
              request = urllib.request.Request(
                  f"https://api.github.com/users/DoubleCore/repos?{query}",
                  headers=headers,
              )
              with urllib.request.urlopen(request) as response:
                  repos = json.load(response)
              if not repos:
                  break
              total += sum(int(repo.get("stargazers_count", 0)) for repo in repos)
              if len(repos) < 100:
                  break
              page += 1

          magnitude = "★" * max(1, len(str(total)))
          path = "README.md"
          text = open(path, encoding="utf-8").read()
          start = "<!-- STAR-MAGNITUDE:START -->"
          end = "<!-- STAR-MAGNITUDE:END -->"
          left = text.index(start) + len(start)
          right = text.index(end, left)
          block = f"""
          <div align="center">
            <sub>{magnitude}</sub>
          </div>
          """
          updated = text[:left] + block + text[right:]
          open(path, "w", encoding="utf-8").write(updated)
          print(f"Total stars: {total}; magnitude: {magnitude}")
          PY

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet || git commit -m "Update star magnitude"
          git push
